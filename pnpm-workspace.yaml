# Storymark — pnpm workspace.
#
# Versions are pinned exactly (no ^/~). Bumps are a deliberate edit, not a
# range-match at install. Refresh with `pnpm view <pkg> version` at scaffold
# time and replace the numbers below.
#
# Workspace packages reference the catalog as:
#   "vue": "catalog:"
# Internal cross-package deps use:
#   "@storymark/shared-types": "workspace:*"

packages:
  - 'apps/storymark-app'
  - 'packages/*'

catalog:
  # --- Phase 0 — locked to current published versions (verified via pnpm view) ---
  vue: 3.5.35
  vue-router: 5.1.0
  '@vitejs/plugin-vue': 6.0.7
  '@vue/tsconfig': 0.9.1
  typescript: 6.0.3
  vite: 8.0.14
  '@types/node': 24.12.4
  primevue: 4.5.5
  '@primeuix/themes': 2.0.3
  primeicons: 7.0.0
  tailwindcss-primeui: 0.6.1
  tailwindcss: 4.3.0
  '@tailwindcss/vite': 4.3.0
  oxlint: 1.67.0
  oxfmt: 0.52.0
  vue-tsc: 3.3.3

  # --- Phases 1+ — referenced as features land; verified at lock time ---
  dexie: 4.4.3
  echarts: 6.1.0
  vue-echarts: 8.0.1
  vite-plugin-pwa: 1.3.0
  workbox-window: 7.4.1
  '@vueuse/core': 14.3.0
  '@vueuse/integrations': 14.3.0
  focus-trap: 8.2.1

onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - sharp
